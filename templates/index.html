<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Globe Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script>
        window.SERVER_TARGETS = {{ targets | tojson }};
    </script>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden h-screen w-screen flex flex-col font-mono m-0 p-0">

    <!-- Header -->
    <header class="h-16 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900/90 backdrop-blur z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-4 h-4 rounded-full bg-cyan-400 animate-ping"></div>
            <h1 class="text-lg font-bold tracking-widest text-cyan-400">QUANTUM GLOBE NAVIGATOR</h1>
        </div>
        <div class="flex space-x-2">
            <button id="tab-game" class="px-4 py-1.5 text-sm bg-cyan-500/20 border border-cyan-500 text-cyan-300 rounded transition hover:bg-cyan-500/35">1. Gate Tuning</button>
            <button id="tab-circuit" class="px-4 py-1.5 text-sm bg-slate-800 border border-slate-700 text-slate-300 rounded transition hover:bg-slate-700">2. State to Circuit</button>
            <button id="tab-tour" class="px-4 py-1.5 text-sm bg-slate-800 border border-slate-700 text-slate-300 rounded transition hover:bg-slate-700">3. Random State Tour</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="flex-1 flex relative w-full h-full overflow-hidden">
        
        <!-- Full Viewport Interactive Real Earth Globe -->
        <div id="globe-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>

        <!-- Left Control Panel (Non-blocking) -->
        <div class="absolute top-6 left-6 z-10 w-[440px] max-h-[85vh] overflow-y-auto bg-slate-900/90 backdrop-blur-md border border-slate-700/60 rounded-xl p-6 shadow-2xl flex flex-col space-y-4 pointer-events-auto">
            <div id="panel-content"></div>
        </div>

        <!-- Bottom Right Bloch Sphere HUD -->
        <div class="absolute bottom-6 right-6 z-10 bg-slate-900/90 backdrop-blur-md border border-slate-700/60 rounded-xl p-4 shadow-2xl flex flex-col items-center pointer-events-auto">
            <span class="text-xs text-cyan-400 font-semibold mb-2 tracking-wider">LIVE BLOCH VECTOR</span>
            <div id="bloch-container" class="w-48 h-48 relative"></div>
            <div class="mt-2 text-xs text-slate-400 text-center">
                $\theta$: <span id="val-theta" class="text-cyan-300">0.00</span> rad | 
                $\phi$: <span id="val-phi" class="text-cyan-300">0.00</span> rad
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
